# Gate de calidad — corre antes de cada commit.
# Instalar una vez:  uv run pre-commit install
# Correr a mano:      uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff            # linter (reemplaza flake8)
        args: [--fix]
        files: ^(src/autocv|tests)/
      - id: ruff-format     # formateador (reemplaza black)
        files: ^(src/autocv|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/autocv/
        additional_dependencies: [types-PyYAML]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
