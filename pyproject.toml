[project]
name = "autocv"
version = "0.1.0"
description = "Generador de CV bilingüe (ES→EN) a PDF desde datos YAML"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "deepl>=1.18.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

# AutoCV es una app (se corre con `uv run`), no una librería a publicar:
# uv gestiona el entorno sin intentar "construir" el proyecto.
[tool.uv]
package = false
