# alembic.ini — configuración de migraciones (Alembic)
# La URL de conexión NO se pone aquí en texto plano: env.py la toma de DATABASE_URL.

[alembic]
script_location = src/database/migrations
prepend_sys_path = .
path_separator = os

# La URL se define en env.py desde el entorno (dev: .env; prod: secreto). Se deja vacía a propósito.
sqlalchemy.url =

# (Opcional) formatear cada migración generada con Ruff:
# [post_write_hooks]
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
