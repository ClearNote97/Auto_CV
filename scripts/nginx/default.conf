# =============================================================================
# Reverse proxy — servicio `nginx` OPCIONAL del docker-compose.
# -----------------------------------------------------------------------------
# Enruta por NOMBRE DE SERVICIO de compose (reflex, prefect-server, mlflow),
# NO por container_name (que es dinámico: ${APP_NAME}_...). Dentro de la red de
# compose, el DNS interno resuelve el nombre del servicio.
# Activa aquí solo los bloques cuyos servicios tengas descomentados en el compose.
# =============================================================================
server {
    listen 80;
    server_name localhost;   # ← Cambiar por tu dominio en producción (y añadir TLS en :443).

    # --- Frontend (Reflex) ---
    # Reflex funciona sobre WebSockets: los headers Upgrade/Connection son OBLIGATORIOS,
    # si no, la app carga pero no reacciona.
    location / {
        proxy_pass http://reflex:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend de eventos de Reflex (:8000). Necesario si separas front y back tras el proxy.
    location /_event/ {
        proxy_pass http://reflex:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # --- Prefect (opcional) ---
    location /prefect/ {
        proxy_pass http://prefect-server:4200/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MLflow (opcional) ---
    location /mlflow/ {
        proxy_pass http://mlflow:5000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
