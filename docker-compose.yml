# =============================================================================
# AutoCV — Entorno de desarrollo
# -----------------------------------------------------------------------------
# Un solo servicio: el contenedor de dev (Python + TeXLive + uv). AutoCV es una
# herramienta CLI SIN base de datos, así que no hay Postgres, web ni orquestación.
# El stack full-stack (DB, API, UI) vive en la plantilla base ClearNote_Dev
# (https://github.com/ClearNote97/ClearNote_Dev) si algún día se necesita.
# =============================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-autocv}
    container_name: ${APP_NAME:-autocv}_dev
    env_file: [.env]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # Monta el repo en el workspace que el Dockerfile espera.
    volumes:
      - .:/workspaces/${APP_NAME:-autocv}:cached
    working_dir: /workspaces/${APP_NAME:-autocv}
    networks:
      - autocv_net
    command: sleep infinity
    stdin_open: true
    tty: true

networks:
  autocv_net:
    name: ${APP_NAME:-autocv}_network
    driver: bridge
